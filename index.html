<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartStudy Hub - Pomodoro Timer & Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    h1 { color: #333; margin-bottom: 5px; font-size: 26px; }
    .author { color: #888; font-size: 14px; margin-bottom: 20px; font-weight: 600; }
    
    /* Timer Display */
    .timer-display {
      font-size: 48px;
      font-weight: bold;
      color: #1e3c72;
      margin: 15px 0;
    }
    .controls button {
      background: #1e3c72;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }
    .controls button:hover { background: #2a5298; }

    /* Stats Card */
    .stats-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      margin-top: 25px;
      text-align: left;
      font-size: 14px;
      color: #444;
      border-top: 3px solid #1e3c72;
    }
    .subject-input {
      width: 100%;
      padding: 8px 10px;
      margin: 8px 0 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn-action {
      background: #28a745;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }
    .btn-reset { background: #dc3545; }
    ul { padding-left: 20px; margin: 10px 0 0 0; }
    li { margin-bottom: 6px; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="container">
    <h1>SmartStudy Hub</h1>
    <div class="author">Pomodoro Timer & Tracker</div>

    <!-- Pomodoro Timer Section (30 min) -->
    <div class="timer-display" id="time">30:00</div>
    <div class="controls">
      <button onclick="startTimer()">Jalqabi</button>
      <button onclick="pauseTimer()">Dhaabi</button>
      <button onclick="resetTimer()">Haaromsi</button>
    </div>

    <!-- Study Tracker Section -->
    <div class="stats-card">
      <h3 style="margin-top:0; color:#1e3c72;">📊 Gabaasa Qo'annaa</h3>
      
      <label for="subjectInput"><b>📚 Gosa Barnootaa:</b></label>
      <input type="text" id="subjectInput" class="subject-input" placeholder="Fkn: Hisaaba, Biyoolojii...">

      <p><b>Guyyoota Qo'atame:</b> <span id="daysCount">0</span> Guyyaa</p>
      <p><b>Seensii Dhumaa:</b> <br><small id="lastTime">Hingalmeeffamne</small></p>

      <div style="text-align: center;">
        <button class="btn-action" onclick="recordStudy()">✅ Har'a Qo'adheera</button>
        <button class="btn-action btn-reset" onclick="resetStats()">🔄 Reset</button>
      </div>

      <h4 style="margin-bottom: 5px; margin-top: 15px;">📜 Seenaa Qo'annaa (Dhuma 5):</h4>
      <ul id="historyList"></ul>
    </div>
  </div>

  <script>
    // Pomodoro Timer Logic (Daqiiqaa 30)
    let timeLeft = 30 * 60;
    let timerId = null;

    function updateDisplay() {
      let minutes = Math.floor(timeLeft / 60);
      let seconds = timeLeft % 60;
      document.getElementById('time').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerId !== null) return;
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          alert("Yeroon qo'annaa xumurameera! Boqonnaa fudhadhu.");
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      timeLeft = 30 * 60;
      updateDisplay();
    }

    // Tracker Logic (localStorage)
    let days = localStorage.getItem('studyDays') || 0;
    let history = JSON.parse(localStorage.getItem('studyHistory')) || [];

    document.getElementById('daysCount').innerText = days;
    updateHistoryUI();

    function recordStudy() {
      let subject = document.getElementById('subjectInput').value.trim();
      if (!subject) {
        subject = "Barnoota Walyalaa";
      }

      let now = new Date();
      let dateStr = now.toLocaleDateString();
      let timeStr = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      let entry = `<b>${subject}</b> (${dateStr} - ${timeStr})`;

      days = parseInt(days) + 1;
      history.push(entry);

      localStorage.setItem('studyDays', days);
      localStorage.setItem('studyHistory', JSON.stringify(history));

      document.getElementById('daysCount').innerText = days;
      document.getElementById('subjectInput').value = ""; // Clear input field
      updateHistoryUI();
    }

    function updateHistoryUI() {
      let list = document.getElementById('historyList');
      list.innerHTML = "";
      history.slice(-5).reverse().forEach(item => {
        let li = document.createElement('li');
        li.innerHTML = item;
        list.appendChild(li);
      });
      if(history.length > 0) {
        document.getElementById('lastTime').innerHTML = history[history.length - 1];
      }
    }

    function resetStats() {
      if(confirm("Gabaasa kana qulqulleessuu barbaadduu?")) {
        localStorage.clear();
        days = 0;
        history = [];
        document.getElementById('daysCount').innerText = 0;
        document.getElementById('lastTime').innerText = "Hingalmeeffamne";
        updateHistoryUI();
      }
    }
  </script>

</body>
</html>
